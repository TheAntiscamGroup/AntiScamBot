version: 2
registries:
  python:
    type: "python-index"
    url: "https://pypi.python.org/simple/"
    username: ${{secrets.GH_DUMMY_USERNAME}}
    password: ${{secrets.GH_DUMMY_PASSWORD}}
    replaces-base: true
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
    registries:
      - python
    groups:
      loggers:
        patterns:
          - "coloredlogs"
          - "logger_tt"
      runtime:
        patterns:
          - "aiohttp"
          - "discord.py"
      data:
        patterns:
          - "sqlalchemy"
          - "python-dotenv"
    insecure-external-code-execution: allow
    cooldown:
      default-days: 7
      semver-major-days: 30
